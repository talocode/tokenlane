[build-system]
requires = ["hatchling>=1.0,<1.29"]
build-backend = "hatchling.build"

[project]
name = "talocode-tokenlane"
version = "0.1.1"
description = "TokenLane plans a real-world asset workflow and reads Talocode Cloud credit prices. It does not issue a token."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "Talocode" }]
keywords = ["talocode", "tokenlane", "rwa", "mcp", "credits"]

[project.urls]
Homepage = "https://github.com/talocode/tokenlane"
Repository = "https://github.com/talocode/tokenlane"

[project.scripts]
tokenlane = "talocode_tokenlane.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["talocode_tokenlane"]

[tool.hatch.build.targets.wheel.force-include]
"talocode_tokenlane/credit-prices.json" = "talocode_tokenlane/credit-prices.json"
